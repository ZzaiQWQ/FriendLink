apply plugin: 'fabric-loom'

def versionName = project.name

// Shared sources/resources for the Fabric 1.21.x line.
// A file with the same relative path inside a version folder overrides this shared copy.
def shared21Main = rootProject.layout.projectDirectory.dir('1.21-shared/src/main')
def shared21JavaDir = rootProject.file('1.21-shared/src/main/java')
def shared21ResourcesDir = rootProject.file('1.21-shared/src/main/resources')
def versionJavaDir = project.file('src/main/java')
def versionResourcesDir = project.file('src/main/resources')
def versionAccessWidener = project.file('src/main/resources/friendlink.accesswidener')
def shared21AccessWidener = rootProject.file('1.21-shared/src/main/resources/friendlink.accesswidener')

base {
    archivesName = "${providers.gradleProperty('archives_base_name').get()}-${versionName}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(providers.gradleProperty('java_version').get().toInteger())
    }
    withSourcesJar()
}

sourceSets {
    main {
        java.srcDir(shared21Main.dir('java'))
        java.exclude { element ->
            def shared21Path = shared21JavaDir.toPath()
            def filePath = element.file.toPath()

            if (filePath.startsWith(shared21Path)) {
                def relativePath = shared21Path.relativize(filePath).toString()
                return new File(versionJavaDir, relativePath).isFile()
            }

            return false
        }

        // Shared resources work the same way as Java sources: version-local files win.
        resources.srcDir(shared21Main.dir('resources'))
        resources.exclude { element ->
            def shared21ResourcesPath = shared21ResourcesDir.toPath()
            def filePath = element.file.toPath()
            if (!filePath.startsWith(shared21ResourcesPath)) {
                return false
            }

            def relativePath = shared21ResourcesPath.relativize(filePath).toString()
            return new File(versionResourcesDir, relativePath).isFile()
        }
    }
}

loom {
    // Most versions use the shared access widener; a version can provide its own when needed.
    accessWidenerPath = versionAccessWidener.isFile() ? versionAccessWidener : shared21AccessWidener
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "dev.onvoid.webrtc:webrtc-java:${project.webrtc_version}"
    runtimeOnly "dev.onvoid.webrtc:webrtc-java:${project.webrtc_version}:windows-x86_64"
    include "dev.onvoid.webrtc:webrtc-java:${project.webrtc_version}"
    include "dev.onvoid.webrtc:webrtc-java:${project.webrtc_version}:windows-x86_64"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.loader_version
    filesMatching('fabric.mod.json') {
        expand(
            'version': project.version,
            'minecraft_version': project.minecraft_version,
            'loader_version': project.loader_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = providers.gradleProperty('java_version').get().toInteger()
}
