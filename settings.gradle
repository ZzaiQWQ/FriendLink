pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'MinecraftLibraries'; url = 'https://libraries.minecraft.net/' }
        mavenCentral()
    }
}

rootProject.name = 'FriendLink'

include 'versions:Fabric-1.21.1'
include 'versions:Fabric-1.21.2'
include 'versions:Fabric-1.21.11'
